<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>SDP Interlude Documentation</title>
        <link rel="stylesheet" href="styles.css">
    </head>
    <body>

        <div class="app">
            <!-- Sidebar -->
            <aside class="sidebar">

                <div class="brand">
                    <div class="brand-icon">
                        PDF
                    </div>

                    <div>
                        <h1>SDP Interlude</h1>
                        <span>Document Library</span>
                    </div>
                </div>

                <div class="sidebar-section">
                    <div class="section-title">
                        Documents
                    </div>

                    <div id="documents" class="documents"></div>
                </div>
            </aside>

            <!-- Main content -->
            <main class="main">

                <header class="topbar">
                    <div>
                        <h2 id="viewerTitle">
                            Select a document
                        </h2>

                        <p id="viewerSubtitle">
                            Choose a document from the sidebar to begin reading.
                        </p>
                    </div>
                </header>

                <section class="viewer-container">

                    <div id="emptyState" class="empty-state">

                        <div class="empty-icon">
                            PDF
                        </div>

                        <h3>No document selected</h3>

                        <p>
                            Select a document from the sidebar
                            to view it here.
                        </p>
                    </div>

                    <iframe
                        id="pdfViewer"
                        title="PDF Viewer"
                    ></iframe>

                </section>
            </main>
        </div>

        <script src="./js/viewer.js"></script>

    </body>

</html>
