<svg width="1100" height="650" viewBox="0 0 1100 650" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <marker id="call" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#10b981"/>
    </marker>
    <marker id="ret" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M1 1L8 5L1 9Z" fill="#5eead4"/>
    </marker>
  </defs>

  <rect x="0" y="0" width="1100" height="650" fill="#0a0f14"/>

  <!-- Legend: slim full-width strip, clear of everything below -->
  <rect x="20" y="10" width="1060" height="32" rx="6" fill="#131a21" stroke="#1f2937" stroke-width="1"/>
  <line x1="34" y1="26" x2="70" y2="26" stroke="#10b981" stroke-width="1.6" marker-end="url(#call)"/>
  <text x="78" y="30" font-family="Arial" font-size="11" fill="#94a3b8">Solid arrow = method call</text>
  <line x1="270" y1="26" x2="306" y2="26" stroke="#5eead4" stroke-width="1.4" stroke-dasharray="4 3" marker-end="url(#ret)"/>
  <text x="314" y="30" font-family="Arial" font-size="11" fill="#94a3b8">Dashed arrow = return</text>
  <text x="500" y="30" font-family="Arial" font-size="11" fill="#94a3b8">Dotted vertical line = lifeline</text>

  <!-- Participant headers -->
  <!-- Coach (actor) -->
  <circle cx="80" cy="70" r="16" fill="#10b981" stroke="#34d399" stroke-width="1.5"/>
  <text x="80" y="75" font-family="Arial" font-size="10" fill="#052e26" text-anchor="middle" font-weight="bold">Coach</text>

  <!-- Frontend -->
  <rect x="155" y="50" width="130" height="42" rx="4" fill="#131a21" stroke="#10b981" stroke-width="1.5"/>
  <text x="220" y="68" font-family="Arial" font-size="11" fill="#5eead4" text-anchor="middle">Frontend</text>
  <text x="220" y="83" font-family="Arial" font-size="10" fill="#f1f5f9" text-anchor="middle">EventFormDialog</text>

  <!-- AuthGuard -->
  <rect x="295" y="50" width="130" height="42" rx="4" fill="#131a21" stroke="#10b981" stroke-width="1.5"/>
  <text x="360" y="75" font-family="Arial" font-size="12" fill="#f1f5f9" text-anchor="middle">AuthGuard</text>

  <!-- EventsController -->
  <rect x="455" y="50" width="130" height="42" rx="4" fill="#131a21" stroke="#10b981" stroke-width="1.5"/>
  <text x="520" y="68" font-family="Arial" font-size="11" fill="#5eead4" text-anchor="middle">EventsController</text>
  <text x="520" y="83" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">+ zodValidate</text>

  <!-- EventsService -->
  <rect x="615" y="50" width="130" height="42" rx="4" fill="#131a21" stroke="#10b981" stroke-width="1.5"/>
  <text x="680" y="75" font-family="Arial" font-size="12" fill="#f1f5f9" text-anchor="middle">EventsService</text>

  <!-- TeamsService -->
  <rect x="775" y="50" width="130" height="42" rx="4" fill="#131a21" stroke="#10b981" stroke-width="1.5"/>
  <text x="840" y="75" font-family="Arial" font-size="12" fill="#f1f5f9" text-anchor="middle">TeamsService</text>

  <!-- Database -->
  <rect x="935" y="50" width="130" height="42" rx="4" fill="#131a21" stroke="#10b981" stroke-width="1.5"/>
  <text x="1000" y="68" font-family="Arial" font-size="11" fill="#5eead4" text-anchor="middle">Database</text>
  <text x="1000" y="83" font-family="Arial" font-size="9" fill="#94a3b8" text-anchor="middle">Neon (events table)</text>

  <!-- Lifelines -->
  <line x1="80" y1="92" x2="80" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="220" y1="92" x2="220" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="360" y1="92" x2="360" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="520" y1="92" x2="520" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="680" y1="92" x2="680" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="840" y1="92" x2="840" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>
  <line x1="1000" y1="92" x2="1000" y2="630" stroke="#334155" stroke-width="1" stroke-dasharray="3 3"/>

  <!-- 1. Coach -> Frontend -->
  <text x="150" y="119" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">Submit event form</text>
  <line x1="80" y1="127" x2="216" y2="127" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>

  <!-- 2. Frontend -> AuthGuard -->
  <text x="290" y="159" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">POST /events (session cookie)</text>
  <line x1="220" y1="167" x2="356" y2="167" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>

  <!-- 3. AuthGuard -> EventsController -->
  <text x="440" y="199" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">session valid &#8594; create(dto)</text>
  <line x1="360" y1="207" x2="516" y2="207" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>

  <!-- 4. EventsController self-loop: zodValidate -->
  <path d="M520 237 L580 237 L580 251 L520 251" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>
  <text x="586" y="237" font-family="Arial" font-size="10" fill="#94a3b8">zodValidate(createEventSchema)</text>

  <!-- 5. EventsController -> EventsService -->
  <text x="600" y="279" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">create(dto)</text>
  <line x1="520" y1="287" x2="676" y2="287" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>

  <!-- 6. EventsService -> TeamsService -->
  <text x="760" y="319" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">findTeamForUser()</text>
  <line x1="680" y1="327" x2="836" y2="327" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>

  <!-- 7. TeamsService --> EventsService -->
  <text x="760" y="359" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">team</text>
  <line x1="840" y1="367" x2="684" y2="367" stroke="#5eead4" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>

  <!-- 8. EventsService -> Database -->
  <text x="840" y="399" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">insert events(...).returning()</text>
  <line x1="680" y1="407" x2="996" y2="407" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>

  <!-- 9. Database --> EventsService -->
  <text x="840" y="439" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">event row</text>
  <line x1="1000" y1="447" x2="684" y2="447" stroke="#5eead4" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>

  <!-- 10. EventsService --> EventsController -->
  <text x="600" y="479" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">event</text>
  <line x1="680" y1="487" x2="524" y2="487" stroke="#5eead4" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>

  <!-- 11. EventsController --> Frontend -->
  <text x="370" y="519" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">201 Created { event }</text>
  <line x1="520" y1="527" x2="224" y2="527" stroke="#5eead4" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>

  <!-- 12. Frontend self-loop -->
  <path d="M220 557 L280 557 L280 571 L220 571" fill="none" stroke="#10b981" stroke-width="1.4" marker-end="url(#call)"/>
  <text x="286" y="557" font-family="Arial" font-size="10" fill="#94a3b8">invalidate ['events']; close dialog</text>

  <!-- 13. Frontend --> Coach -->
  <text x="150" y="599" font-family="Arial" font-size="10" fill="#94a3b8" text-anchor="middle">updated event list shown</text>
  <line x1="220" y1="607" x2="84" y2="607" stroke="#5eead4" stroke-width="1.3" stroke-dasharray="4 3" marker-end="url(#ret)"/>

</svg>
