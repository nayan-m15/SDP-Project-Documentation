<text x="470" y="238" font-family="Arial" font-size="9.5" fill="#94a3b8">status = 'scheduled'</text>
<text x="470" y="253" font-family="Arial" font-size="9.5" fill="#94a3b8">set by DB column default</text>
<text x="470" y="268" font-family="Arial" font-size="9.5" fill="#94a3b8">PATCH may edit title/date/</text>
<text x="470" y="283" font-family="Arial" font-size="9.5" fill="#94a3b8">location without changing status</text>

