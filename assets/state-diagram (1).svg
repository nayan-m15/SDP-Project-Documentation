<text x="790" y="668" font-family="Arial" font-size="9.5" fill="#94a3b8">status = 'completed'</text>
<text x="790" y="683" font-family="Arial" font-size="9.5" fill="#94a3b8">only via PATCH { status:</text>
<text x="790" y="698" font-family="Arial" font-size="9.5" fill="#94a3b8">'completed' } - no dedicated route</text>

